services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snipster_app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:///snipster.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - API_URL=http://localhost:8000/
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Para persistir la base de datos SQLite
      - ./snipster.db:/app/snipster.db  # Montar la DB directamente si ya existe
    restart: unless-stopped

volumes:
  data:
